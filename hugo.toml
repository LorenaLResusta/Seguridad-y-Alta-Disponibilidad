# Configuración del sitio Hugo de los apuntes de Seguridad y Alta Disponibilidad
# En GitHub Pages la Action sobrescribe baseURL con la URL real del sitio.
baseURL = "https://lorenalresusta.github.io/Seguridad-y-Alta-Disponibilidad/"
locale = "es-es"
title = "Seguridad y Alta Disponibilidad"
theme = "hugo-book"

# Idioma por defecto
defaultContentLanguage = "es"

[languages]
  [languages.es]
    languageName = "Castellano"
    weight = 1
    contentDir = "content.es"

  [languages.val]
    languageName = "Valencià"
    weight = 2
    contentDir = "content.val"

[params]
  # Origen de los ficheros a renderizar
  BookSection = '/'
  # Tabla de contenidos lateral en cada página
  BookToC = true
  # Buscador integrado
  BookSearch = true
  # Enlace al repositorio
  BookRepo = 'https://github.com/LorenaLResusta/Seguridad-y-Alta-Disponibilidad'

[markup]
  [markup.goldmark.renderer]
    # Necesario para Mermaid y algunos bloques HTML de los apuntes
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[caches]
  [caches.images]
    dir = ':cacheDir/images'
