<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 316" width="900" height="316" role="img" aria-label="politica-cripto.md · Mediterránea Dental"><rect width="900" height="316" fill="#fff"/><rect width="900" height="36" fill="#1d1b2f"/><text x="24" y="24" font-family="monospace" font-size="15" fill="#ffd54f">politica-cripto.md · Mediterránea Dental</text><rect x="0" y="32" width="900" height="30" fill="#f5f4fb"/><text x="24" y="52" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">1. Copias cifradas con AES-256-GCM.</text><text x="24" y="82" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">2. Contraseñas de usuarios guardadas como SHA-256 sin sal.</text><rect x="0" y="92" width="900" height="30" fill="#f5f4fb"/><text x="24" y="112" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">3. Ficheros grandes cifrados directamente con RSA.</text><text x="24" y="142" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">4. Las facturas se firman con la clave pública de la empresa.</text><rect x="0" y="152" width="900" height="30" fill="#f5f4fb"/><text x="24" y="172" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">5. Web pública con certificado autofirmado (los navegadores lo aceptan).</text><text x="24" y="202" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">6. TLS 1.0 permitido por compatibilidad con equipos antiguos.</text><rect x="0" y="212" width="900" height="30" fill="#f5f4fb"/><text x="24" y="232" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">7. Claves SSH de tipo Ed25519 y certificados web renovados con ACME.</text><text x="24" y="262" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">8. Para comprobar un fichero descargado se compara su hash con el del proveedor.</text></svg>