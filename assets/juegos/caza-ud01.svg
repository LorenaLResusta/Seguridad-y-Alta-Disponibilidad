<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 346" width="900" height="346" role="img" aria-label="informe-riesgos.txt · Mediterránea Dental"><rect width="900" height="346" fill="#fff"/><rect width="900" height="36" fill="#1d1b2f"/><text x="24" y="24" font-family="monospace" font-size="15" fill="#ffd54f">informe-riesgos.txt · Mediterránea Dental</text><rect x="0" y="32" width="900" height="30" fill="#f5f4fb"/><text x="24" y="52" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">1. Activo: servidor de historiales clínicos (valor: crítico).</text><text x="24" y="82" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">2. Amenaza: servidor de historiales clínicos.</text><rect x="0" y="92" width="900" height="30" fill="#f5f4fb"/><text x="24" y="112" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">3. Vulnerabilidad: contraseñas de administrador por defecto.</text><text x="24" y="142" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">4. Riesgo = probabilidad + impacto.</text><rect x="0" y="152" width="900" height="30" fill="#f5f4fb"/><text x="24" y="172" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">5. Medida: formación del personal contra el phishing (control técnico).</text><text x="24" y="202" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">6. Política: contraseña mínima de 6 caracteres con cambio forzado cada 30 días.</text><rect x="0" y="212" width="900" height="30" fill="#f5f4fb"/><text x="24" y="232" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">7. Principio aplicado: la recepción solo puede leer las citas (mínimo privilegio).</text><text x="24" y="262" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">8. Si hay una brecha de datos personales: notificar a la AEPD en 7 días.</text><rect x="0" y="272" width="900" height="30" fill="#f5f4fb"/><text x="24" y="292" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">9. Un ransomware que cifra los servidores afecta sobre todo a la disponibilidad.</text></svg>