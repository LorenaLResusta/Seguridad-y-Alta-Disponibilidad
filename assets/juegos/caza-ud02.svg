<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 316" width="900" height="316" role="img" aria-label="plan-copias.md · Mediterránea Dental"><rect width="900" height="316" fill="#fff"/><rect width="900" height="36" fill="#1d1b2f"/><text x="24" y="24" font-family="monospace" font-size="15" fill="#ffd54f">plan-copias.md · Mediterránea Dental</text><rect x="0" y="32" width="900" height="30" fill="#f5f4fb"/><text x="24" y="52" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">1. Almacenamiento: RAID 1 con dos discos de 4 TB → 4 TB útiles.</text><text x="24" y="82" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">2. Almacenamiento: RAID 5 con tres discos de 2 TB → 6 TB útiles.</text><rect x="0" y="92" width="900" height="30" fill="#f5f4fb"/><text x="24" y="112" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">3. Protección de datos: el RAID 1 sustituye a la copia de seguridad.</text><text x="24" y="142" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">4. Copias: NAS siempre conectado con credenciales de escritura (protege del ransomware).</text><rect x="0" y="152" width="900" height="30" fill="#f5f4fb"/><text x="24" y="172" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">5. Objetivo: RPO de 24 horas con una copia semanal.</text><text x="24" y="202" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">6. Verificación: las copias nunca se han restaurado, pero el log dice «OK».</text><rect x="0" y="212" width="900" height="30" fill="#f5f4fb"/><text x="24" y="232" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">7. Retención: 7 diarias y 4 semanales con una copia fuera del edificio.</text><text x="24" y="262" font-family="monospace" font-size="15" fill="#1d1b2f" xml:space="preserve">8. Energía: SAI para apagar los servidores de forma ordenada ante un corte.</text></svg>