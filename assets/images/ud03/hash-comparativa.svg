<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Almacenamiento de contraseñas" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><defs><marker id="amut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker><marker id="aredS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="agrnS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ablueS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="aambS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker></defs><rect width="900" height="250" fill="#fff"/><text x="450" y="28" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700">Tras el robo de la base de datos</text><rect x="20" y="50" width="420" height="170" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="230" y="78" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">SHA-1 sin sal (LinkedIn, 2012)</text><text x="230" y="110" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">clave → SHA-1 → hash</text><text x="230" y="135" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">misma clave = mismo hash</text><text x="230" y="160" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">millones de intentos por segundo</text><text x="230" y="195" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">Se recupera casi todo en días</text><rect x="460" y="50" width="420" height="170" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="670" y="78" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">yescrypt / Argon2id + sal</text><text x="670" y="110" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">clave + sal aleatoria → hash lento</text><text x="670" y="135" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">cada usuario, un hash distinto</text><text x="670" y="160" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">cientos-miles de intentos por segundo</text><text x="670" y="195" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">Ataque mucho más caro; no salva claves débiles</text></svg>