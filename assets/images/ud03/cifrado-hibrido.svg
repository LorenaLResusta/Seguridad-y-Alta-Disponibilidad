<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" width="760" height="348" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Esquema de cifrado híbrido</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
</defs>
<rect x="1" y="1" width="758" height="346" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" fill="#1f2328">
<text x="380" y="24" font-size="15" text-anchor="middle" font-weight="700">Criptografía híbrida: lo mejor de la simétrica y de la asimétrica</text>
<rect x="20" y="44" width="210" height="36" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="125.0" y="66.5" font-size="13" text-anchor="middle" font-weight="700">Alice (emisor)</text>
<rect x="530" y="44" width="210" height="36" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="635.0" y="66.5" font-size="13" text-anchor="middle" font-weight="700">Bob (receptor)</text>
<line x1="530" y1="105" x2="232" y2="105" stroke="#1a7f37" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/>
<text stroke="#ffffff" stroke-width="4" paint-order="stroke" x="380" y="96" font-size="11" text-anchor="middle" font-weight="600" fill="#1a7f37">① Bob publica su clave pública</text>
<rect x="20" y="120" width="210" height="52" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
<text x="125.0" y="142.1" font-size="13" text-anchor="middle" font-weight="700">② Genera clave de sesión K</text>
<text x="125.0" y="159.1" font-size="12" text-anchor="middle" font-weight="400">aleatoria y de un solo uso</text>
<rect x="20" y="184" width="210" height="52" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
<text x="125.0" y="206.1" font-size="13" text-anchor="middle" font-weight="700">③ Cifra el mensaje con K</text>
<text x="125.0" y="223.1" font-size="12" text-anchor="middle" font-weight="400">AES-256-GCM (rápido)</text>
<rect x="20" y="248" width="210" height="52" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
<text x="125.0" y="270.1" font-size="13" text-anchor="middle" font-weight="700">④ Cifra K con la pública de Bob</text>
<text x="125.0" y="287.1" font-size="12" text-anchor="middle" font-weight="400">RSA-OAEP o ECDH+HKDF</text>
<line x1="232" y1="224" x2="528" y2="224" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
<text stroke="#ffffff" stroke-width="4" paint-order="stroke" x="380" y="214" font-size="11" text-anchor="middle" font-weight="600" fill="#57606a">⑤ Envía: mensaje cifrado + K cifrada</text>
<rect x="530" y="184" width="210" height="52" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
<text x="635.0" y="206.1" font-size="13" text-anchor="middle" font-weight="700">⑥ Descifra K</text>
<text x="635.0" y="223.1" font-size="12" text-anchor="middle" font-weight="400">con su clave PRIVADA</text>
<rect x="530" y="248" width="210" height="52" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="635.0" y="270.1" font-size="13" text-anchor="middle" font-weight="700">⑦ Descifra el mensaje</text>
<text x="635.0" y="287.1" font-size="12" text-anchor="middle" font-weight="400">con K y verifica la etiqueta</text>
<text x="380" y="330" font-size="12" text-anchor="middle" font-weight="400" fill="#57606a">La simétrica cifra los datos (rápida); la asimétrica solo protege la clave K (resuelve la distribución de claves)</text>

</g>
</svg>
