0" y="126.33333333333333" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">(CVE-2025-41450/51)</text><rect x="370" y="60" width="150" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="445.0" y="100.83333333333333" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">Controlador</text><text x="445.0" y="117.83333333333333" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">AK-SM / AK-SC</text><rect x="545" y="60" width="150" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="620.0" y="92.33333333333333" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">Descongelación</text><text x="620.0" y="109.33333333333333" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">forzada</text><text x="620.0" y="126.33333333333333" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">(hasta 50 °C)</text><rect x="720" y="60" width="150" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="795.0" y="92.33333333333333" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">Alimentos</text><text x="795.0" y="109.33333333333333" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">perdidos,</text><text x="795.0" y="126.33333333333333" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">incendios</text><line x1="170" y1="105" x2="195" y2="105" stroke="#dc2626" stroke-width="2" marker-end="url(#aredS)"/><line x1="345" y1="105" x2="370" y2="105" stroke="#dc2626" stroke-width="2" marker-end="url(#aredS)"/><line x1="520" y1="105" x2="545" y2="105" stroke="#dc2626" stroke-width="2" marker-end="url(#aredS)"/><line x1="695" y1="105" x2="720" y2="105" stroke="#dc2626" stroke-width="2" marker-end="url(#aredS)"/><text x="450" y="190" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400">Fallo de diseño: dispositivo industrial publicado en Internet,