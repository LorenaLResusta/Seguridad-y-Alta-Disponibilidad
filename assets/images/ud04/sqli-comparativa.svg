<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Inyección SQL frente a consulta preparada" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><defs><marker id="amut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker><marker id="aredS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="agrnS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ablueS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="aambS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker></defs><rect width="900" height="330" fill="#fff"/><text x="450" y="26" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">Entrada del usuario:   &#x27; OR 1=1 -- -</text><rect x="20" y="50" width="420" height="250" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="230" y="78" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">Consulta concatenada (vulnerable)</text><rect x="40" y="95" width="380" height="50" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="230.0" y="124.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="400">… WHERE nombre LIKE &#x27;%&#x27; OR 1=1 -- -%&#x27;</text><text x="230" y="175" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">La BD interpreta el dato como SQL</text><text x="230" y="200" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">→ devuelve TODA la tabla</text><text x="230" y="225" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">→ con UNION lee otras tablas</text><text x="230" y="270" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">Resultado: fuga de datos</text><rect x="460" y="50" width="420" height="250" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="670" y="78" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">Consulta preparada (correcta)</text><rect x="480" y="95" width="380" height="50" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="670.0" y="124.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="400">… LIKE ?     +  dato enviado aparte</text><text x="670" y="175" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">La BD trata el dato SIEMPRE como texto</text><text x="670" y="200" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">→ busca un nombre literal &quot;&#x27; OR 1=1&quot;</text><text x="670" y="225" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">→ + mínimo privilegio + sin errores visibles</text><text x="670" y="270" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="700">Resultado: 0 filas</text></svg>