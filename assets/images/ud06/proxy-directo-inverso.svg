<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" width="760" height="304" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Comparativa entre proxy directo y proxy inverso</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
</defs>
<rect x="1" y="1" width="758" height="302" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" fill="#1f2328">
<text x="380" y="22" font-size="15" text-anchor="middle" font-weight="700">Proxy directo y proxy inverso: misma idea, papeles opuestos</text>
<rect x="10" y="40" width="365" height="220" rx="8" fill="none" stroke="#d0d7de" stroke-dasharray="4 4"/>
<rect x="385" y="40" width="365" height="220" rx="8" fill="none" stroke="#d0d7de" stroke-dasharray="4 4"/>
<text x="192" y="62" font-size="13" text-anchor="middle" font-weight="700" fill="#0969da">Proxy directo (Squid)</text>
<text x="192" y="78" font-size="11" text-anchor="middle" font-weight="400" fill="#57606a">controla la SALIDA de los clientes</text>
<rect x="20" y="110" width="90" height="60" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="65.0" y="136.2" font-size="12" text-anchor="middle" font-weight="700">Clientes</text>
<text x="65.0" y="152.2" font-size="11" text-anchor="middle" font-weight="400">LAN</text>
<rect x="140" y="110" width="90" height="60" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="185.0" y="136.2" font-size="12" text-anchor="middle" font-weight="700">Squid</text>
<text x="185.0" y="152.2" font-size="11" text-anchor="middle" font-weight="400">proxy</text>
<rect x="265" y="110" width="100" height="60" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
<text x="315.0" y="136.2" font-size="12" text-anchor="middle" font-weight="700">Internet</text>
<text x="315.0" y="152.2" font-size="11" text-anchor="middle" font-weight="400"></text>
<line x1="111" y1="140" x2="138" y2="140" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
<line x1="231" y1="140" x2="263" y2="140" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
<text x="192" y="205" font-size="12" text-anchor="middle" font-weight="400">ACL, autenticación, caché,</text>
<text x="192" y="222" font-size="12" text-anchor="middle" font-weight="400">filtrado y registro de la salida</text>
<text x="567" y="62" font-size="13" text-anchor="middle" font-weight="700" fill="#bc4c00">Proxy inverso (Nginx)</text>
<text x="567" y="78" font-size="11" text-anchor="middle" font-weight="400" fill="#57606a">protege la ENTRADA hacia los servidores</text>
<rect x="395" y="110" width="90" height="60" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
<text x="440.0" y="136.2" font-size="12" text-anchor="middle" font-weight="700">Internet</text>
<text x="440.0" y="152.2" font-size="11" text-anchor="middle" font-weight="400"></text>
<rect x="515" y="110" width="90" height="60" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
<text x="560.0" y="136.2" font-size="12" text-anchor="middle" font-weight="700">Nginx</text>
<text x="560.0" y="152.2" font-size="11" text-anchor="middle" font-weight="400">proxy inverso</text>
<rect x="640" y="90" width="100" height="40" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="690.0" y="113.8" font-size="11" text-anchor="middle" font-weight="700">app1 (privada)</text>
<rect x="640" y="150" width="100" height="40" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="690.0" y="173.8" font-size="11" text-anchor="middle" font-weight="700">app2 (privada)</text>
<line x1="486" y1="140" x2="513" y2="140" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
<line x1="606" y1="130" x2="638" y2="112" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
<line x1="606" y1="150" x2="638" y2="168" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
<text x="567" y="215" font-size="12" text-anchor="middle" font-weight="400">TLS, WAF, balanceo, límites de peticiones</text>
<text x="567" y="232" font-size="12" text-anchor="middle" font-weight="400">y oculta la topología interna</text>
<text x="380" y="286" font-size="12" text-anchor="middle" font-weight="400" fill="#57606a">Pregunta clave: ¿a quién protege el intermediario, a los clientes o a los servidores?</text>

</g>
</svg>
