<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Inundación SYN" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><defs><marker id="amut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker><marker id="aredS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="agrnS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ablueS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="aambS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker></defs><rect width="900" height="300" fill="#fff"/><text x="450" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700">Saludo TCP normal frente a inundación SYN</text><rect x="20" y="45" width="420" height="235" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="230" y="70" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">Normal</text><text x="60" y="100" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">Cliente</text><text x="400" y="100" font-size="13" fill="#1f2937" text-anchor="end" font-weight="400">Servidor</text><line x1="70" y1="125" x2="400" y2="125" stroke="#2563eb" stroke-width="2" marker-end="url(#ablueS)"/><text x="235.0" y="119.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">SYN</text><line x1="400" y1="160" x2="70" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#ablueS)"/><text x="235.0" y="154.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">SYN-ACK</text><line x1="70" y1="195" x2="400" y2="195" stroke="#2563eb" stroke-width="2" marker-end="url(#ablueS)"/><text x="235.0" y="189.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">ACK</text><text x="230" y="245" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">Conexión establecida</text><rect x="460" y="45" width="420" height="235" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="670" y="70" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">Ataque</text><text x="500" y="100" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">Atacante</text><text x="840" y="100" font-size="13" fill="#1f2937" text-anchor="end" font-weight="400">Servidor</text><line x1="510" y1="125" x2="840" y2="125" stroke="#dc2626" stroke-width="2" marker-end="url(#aredS)"/><text x="675.0" y="119.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">SYN</text><line x1="510" y1="145" x2="840" y2="145" stroke="#dc2626" stroke-width="2" marker-end="url(#aredS)"/><line x1="510" y1="165" x2="840" y2="165" stroke="#dc2626" stroke-width="2" marker-end="url(#aredS)"/><text x="670" y="205" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">… nunca envía el ACK</text><text x="670" y="235" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">Cola y tabla conntrack llenas</text><text x="670" y="258" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="400">Clientes legítimos rechazados</text></svg>