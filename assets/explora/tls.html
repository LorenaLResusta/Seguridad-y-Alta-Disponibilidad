<div class="sad-w" style="--c: var(--color-accent-note)">
  <div class="sad-w-head"><span class="sad-w-tag">Explora</span> Saludo (handshake) de TLS 1.3 paso a paso <span class="sad-w-sub">1 viaje de ida y vuelta (1-RTT)</span></div>
  <div class="sad-w-body">
    <div class="sad-w-row"><button type="button" data-r="a">← Anterior</button><button type="button" data-r="s">Siguiente →</button><span data-r="n" style="align-self:center"></span></div>
    <div class="sad-w-out" data-r="o" aria-live="polite"></div>
  </div>
</div>
<script>(function(){
var r=document.currentScript.previousElementSibling,q=function(n){return r.querySelector('[data-r="'+n+'"]')};
var P=[
{w:'Cliente → Servidor',m:'ClientHello',c:'Versiones admitidas (TLS 1.3), suites de cifrado, nombre del servidor (SNI) y la <strong>parte pública de un intercambio Diffie-Hellman efímero</strong> (<code>key_share</code>).',v:'Lo ve cualquier observador de la red (va en claro; con ECH puede ocultarse el SNI).',g:'El cliente apuesta ya por un algoritmo de intercambio de claves para ahorrar un viaje.'},
{w:'Servidor → Cliente',m:'ServerHello',c:'Suite de cifrado elegida y su <code>key_share</code> (parte pública DH del servidor).',v:'En claro. A partir de aquí <strong>ambos calculan el mismo secreto compartido</strong> sin haberlo enviado nunca.',g:'Se derivan las claves del resto del saludo. Todo lo que sigue va cifrado.'},
{w:'Servidor → Cliente (cifrado)',m:'EncryptedExtensions · Certificate · CertificateVerify · Finished',c:'El <strong>certificado</strong> del servidor, una <strong>firma</strong> con su clave privada sobre todo el saludo (<code>CertificateVerify</code>) y un MAC (<code>Finished</code>).',v:'Cifrado: un espía ya no ve ni el certificado.',g:'<strong>Autenticación</strong>: el cliente comprueba la cadena de confianza (CA), el nombre (SAN) y la firma. Y garantiza que nadie ha alterado el saludo.'},
{w:'Cliente → Servidor (cifrado)',m:'Finished',c:'MAC de todo el saludo con la clave derivada.',v:'Cifrado.',g:'El saludo termina. Ambos confirman que han calculado las mismas claves.'},
{w:'Ambos (cifrado)',m:'Datos de aplicación (HTTP, etc.)',c:'Cifrado simétrico autenticado (AES-GCM o ChaCha20-Poly1305) con claves de sesión.',v:'Solo se ve que hay tráfico cifrado entre dos IP.',g:'<strong>Confidencialidad e integridad</strong> con criptografía simétrica (rápida). Como el DH es efímero, hay <strong>secreto perfecto hacia adelante</strong>: robar la clave privada del servidor después no permite descifrar sesiones antiguas.'}];
var i=0;
function go(){var p=P[i];q('n').textContent='Paso '+(i+1)+' de '+P.length;
 q('o').innerHTML='<p><strong>'+p.w+':</strong> <code>'+p.m+'</code></p><p>'+p.c+'</p><p><em>¿Qué ve un espía?</em> '+p.v+'</p><p><em>¿Qué se consigue?</em> '+p.g+'</p>'+(i===P.length-1?'<p>Compruébalo en el laboratorio: <code>openssl s_client -connect servidor:443 -tls1_3</code> y busca «Protocol: TLSv1.3», la suite elegida y «Verification: OK».</p>':'');
 q('a').disabled=i===0;q('s').disabled=i===P.length-1}
q('a').onclick=function(){if(i>0){i--;go()}};q('s').onclick=function(){if(i<P.length-1){i++;go()}};go()})();</script>
