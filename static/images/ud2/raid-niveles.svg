<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 322" width="790" height="322" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Esquema de RAID 0, RAID 1 y RAID 5</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
</defs>
<rect x="1" y="1" width="788" height="320" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" fill="#1f2328">
<text x="360" y="24" font-size="14" text-anchor="middle" font-weight="700">Niveles RAID más habituales (A, B, C = bloques de datos; P = paridad)</text>
<text x="130" y="56" font-size="13" text-anchor="middle" font-weight="700">RAID 0 (stripe)</text>
<rect x="40" y="66" width="80" height="136" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
<rect x="48" y="74" width="64" height="34" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="80.0" y="95.2" font-size="12" text-anchor="middle" font-weight="700">A1</text>
<rect x="48" y="114" width="64" height="34" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="80.0" y="135.2" font-size="12" text-anchor="middle" font-weight="700">A3</text>
<rect x="48" y="154" width="64" height="34" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="80.0" y="175.2" font-size="12" text-anchor="middle" font-weight="700">A5</text>
<text x="80.0" y="222" font-size="11" text-anchor="middle" font-weight="400" fill="#57606a">Disco 1</text>
<rect x="140" y="66" width="80" height="136" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
<rect x="148" y="74" width="64" height="34" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="180.0" y="95.2" font-size="12" text-anchor="middle" font-weight="700">A2</text>
<rect x="148" y="114" width="64" height="34" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="180.0" y="135.2" font-size="12" text-anchor="middle" font-weight="700">A4</text>
<rect x="148" y="154" width="64" height="34" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="180.0" y="175.2" font-size="12" text-anchor="middle" font-weight="700">A6</text>
<text x="180.0" y="222" font-size="11" text-anchor="middle" font-weight="400" fill="#57606a">Disco 2</text>
<text x="130" y="250" font-size="12" text-anchor="middle" font-weight="400">Más velocidad y capacidad total</text>
<text x="130" y="268" font-size="12" text-anchor="middle" font-weight="700" fill="#cf222e">Tolerancia a fallos: ninguna</text>
<text x="380" y="56" font-size="13" text-anchor="middle" font-weight="700">RAID 1 (espejo)</text>
<rect x="290" y="66" width="80" height="136" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
<rect x="298" y="74" width="64" height="34" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="330.0" y="95.2" font-size="12" text-anchor="middle" font-weight="700">A</text>
<rect x="298" y="114" width="64" height="34" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="330.0" y="135.2" font-size="12" text-anchor="middle" font-weight="700">B</text>
<rect x="298" y="154" width="64" height="34" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="330.0" y="175.2" font-size="12" text-anchor="middle" font-weight="700">C</text>
<text x="330.0" y="222" font-size="11" text-anchor="middle" font-weight="400" fill="#57606a">Disco 1</text>
<rect x="390" y="66" width="80" height="136" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
<rect x="398" y="74" width="64" height="34" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="430.0" y="95.2" font-size="12" text-anchor="middle" font-weight="700">A</text>
<rect x="398" y="114" width="64" height="34" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="430.0" y="135.2" font-size="12" text-anchor="middle" font-weight="700">B</text>
<rect x="398" y="154" width="64" height="34" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="430.0" y="175.2" font-size="12" text-anchor="middle" font-weight="700">C</text>
<text x="430.0" y="222" font-size="11" text-anchor="middle" font-weight="400" fill="#57606a">Disco 2</text>
<text x="380" y="250" font-size="12" text-anchor="middle" font-weight="400">Capacidad = la de un disco</text>
<text x="380" y="268" font-size="12" text-anchor="middle" font-weight="700" fill="#1a7f37">Soporta el fallo de 1 disco</text>
<text x="610" y="56" font-size="13" text-anchor="middle" font-weight="700">RAID 5 (paridad distribuida)</text>
<rect x="530" y="66" width="70" height="136" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
<rect x="538" y="74" width="54" height="34" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="565.0" y="95.2" font-size="12" text-anchor="middle" font-weight="700">A1</text>
<rect x="538" y="114" width="54" height="34" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="565.0" y="135.2" font-size="12" text-anchor="middle" font-weight="700">B1</text>
<rect x="538" y="154" width="54" height="34" rx="5" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
<text x="565.0" y="175.2" font-size="12" text-anchor="middle" font-weight="700">Pc</text>
<text x="565.0" y="222" font-size="11" text-anchor="middle" font-weight="400" fill="#57606a">Disco 1</text>
<rect x="610" y="66" width="70" height="136" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
<rect x="618" y="74" width="54" height="34" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="645.0" y="95.2" font-size="12" text-anchor="middle" font-weight="700">A2</text>
<rect x="618" y="114" width="54" height="34" rx="5" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
<text x="645.0" y="135.2" font-size="12" text-anchor="middle" font-weight="700">Pb</text>
<rect x="618" y="154" width="54" height="34" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="645.0" y="175.2" font-size="12" text-anchor="middle" font-weight="700">C1</text>
<text x="645.0" y="222" font-size="11" text-anchor="middle" font-weight="400" fill="#57606a">Disco 2</text>
<rect x="690" y="66" width="70" height="136" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
<rect x="698" y="74" width="54" height="34" rx="5" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
<text x="725.0" y="95.2" font-size="12" text-anchor="middle" font-weight="700">Pa</text>
<rect x="698" y="114" width="54" height="34" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="725.0" y="135.2" font-size="12" text-anchor="middle" font-weight="700">B2</text>
<rect x="698" y="154" width="54" height="34" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="725.0" y="175.2" font-size="12" text-anchor="middle" font-weight="700">C2</text>
<text x="725.0" y="222" font-size="11" text-anchor="middle" font-weight="400" fill="#57606a">Disco 3</text>
<text x="645" y="250" font-size="12" text-anchor="middle" font-weight="400">Capacidad = (N−1) discos</text>
<text x="645" y="268" font-size="12" text-anchor="middle" font-weight="700" fill="#1a7f37">Soporta el fallo de 1 disco</text>
<text x="395" y="300" font-size="13" text-anchor="middle" font-weight="700" fill="#bc4c00">RAID mejora la disponibilidad, pero NO sustituye a la copia de seguridad</text>

</g>
</svg>
